# Builds, tests and publishes the game to GitHub Pages (plan research R8).
#   Pull request and push to main: verify.
#   Push to main, or a manual run on main: verify, then deploy. deploy needs verify, so a
#   failed build or test never replaces the live site (AC-19, FR-017).
#   Rollback: run manually with `ref` set to the last good commit (plan "Deployment and Rollback").

name: ci-deploy

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: Commit to build and publish (rollback); leave empty for the latest
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: ci-deploy-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    # The ceiling (owner, 2026-11-09): if the job outgrows this, shorten it rather than raise this.
    timeout-minutes: 20
    # Playwright's own image holds the browsers and the system libraries they need, so no run
    # installs them (one install took 5m 44s, 2026-11-09). Its tag must match @playwright/test in
    # package.json, or the browsers are not found.
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:2f05f8a734509a7b3f26a912639488ee08f58a7b292d14d62271bcff9038768f
      options: --ipc=host
    env:
      CI: true
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          # The whole history: the existing-test check compares with the pull request's base.
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: Check no recorded exception has expired (Baseline 9)
        run: npm run exceptions:check

      - name: Check no existing unit test changed without a recorded reason
        if: github.event_name == 'pull_request'
        run: npm run tests:guard
        env:
          TEST_GUARD_BASE: ${{ github.event.pull_request.base.sha }}

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Acceptance tests
        run: npm run test:acceptance

      - name: Keep the Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: test-results/
          retention-days: 7

      - name: Upload the site
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    needs: verify
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - name: Publish
        id: publish
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: Check the public address serves this commit (AC-17)
        run: npm run test:acceptance:engine
        env:
          ACCEPTANCE_PUBLIC_URL: ${{ steps.publish.outputs.page_url }}
